<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>関東 市町村位置クイズ - リアル地図版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE3; --paper-dark:#E9E2CE; --ink:#1E2A2F; --ink-soft:#4A5960;
    --line:#C9BFA5; --correct:#2E7D5B; --wrong:#B23A2E; --gold:#C89B3C;
    --tokyo:#008D4F; --kanagawa:#0067A3; --saitama:#E8871E; --chiba:#D8442C;
    --ibaraki:#7CA82B; --tochigi:#6B3FA0; --gunma:#D5237B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(200,155,60,0.10), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(0,141,79,0.08), transparent 45%),
      var(--paper);
    font-family:"Noto Sans JP",sans-serif; color:var(--ink);
    min-height:100vh; display:flex;
    justify-content:center; padding:28px 14px 60px;
  }
  .app{width:100%;max-width:760px;}

  .board{
    background:var(--ink); color:var(--paper); border-radius:6px;
    padding:18px 20px 16px; position:relative; overflow:hidden;
    box-shadow:0 6px 0 rgba(0,0,0,0.15);
  }
  .board::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:10px;
    background:linear-gradient(180deg,var(--tokyo),var(--kanagawa),var(--saitama),var(--chiba),var(--ibaraki),var(--tochigi),var(--gunma));
  }
  .board .eyebrow{ font-size:11px; letter-spacing:.24em; color:var(--gold); font-weight:700; padding-left:14px; }
  .board h1{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:24px; margin:4px 0 2px 14px; letter-spacing:.02em; }
  .board .sub{ padding-left:14px; font-size:12px; color:#C9C2AE; letter-spacing:.06em; }

  .pref-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:20px; }
  .pref-card{ background:#fff; border:2px solid var(--line); border-radius:8px; padding:16px 12px; text-align:center; cursor:pointer; transition:all .15s ease; }
  .pref-card:hover{ transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,0.10); }
  .work-card{ grid-column:1 / -1; border-color:var(--gold); background:linear-gradient(135deg, #fff, #FBF3DF); }
  .work-card .pref-card-name{ color:#8a6d1f; }
  .pref-card-name{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:16px; margin-bottom:4px; }
  .pref-card-num{ font-size:12px; color:var(--ink-soft); }

  .quiz-container{ margin-top:20px; }
  .quiz-header{ background:#fff; border:3px solid var(--ink); border-radius:8px; padding:14px 16px; margin-bottom:14px; box-shadow:0 4px 0 rgba(30,42,47,0.08); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .quiz-header-left{ flex:1; }
  .quiz-header-title{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:20px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .quiz-header-title .pref-color{ font-size:13px; font-weight:700; padding:4px 10px; border-radius:4px; color:#fff; min-width:60px; text-align:center; }
  .quiz-progress{ display:flex; gap:2px; }
  .prog-dot{ flex:1; height:3px; border-radius:1.5px; background:var(--line); }
  .prog-dot.done{ background:var(--ink-soft); }
  .prog-dot.current{ background:var(--gold); }
  .quiz-nav-btn{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:12px; background:var(--ink-soft); color:#fff; border:none; border-radius:5px; padding:6px 12px; cursor:pointer; letter-spacing:.04em; transition:background .1s; }
  .quiz-nav-btn:hover{ background:var(--ink); }
  .quiz-nav-btn:active{ transform:scale(0.95); }

  .quiz-question{ background:#fff; border:3px solid var(--ink); border-radius:10px; padding:0; overflow:hidden; box-shadow:0 8px 0 rgba(30,42,47,0.10); }
  .q-body{ padding:18px 16px 4px; }
  .q-name{ font-family:"Zen Old Mincho",serif; font-weight:600; font-size:clamp(28px,6vw,38px); text-align:center; color:var(--ink); margin-bottom:4px; }
  .q-yomi{ font-size:12px; color:var(--ink-soft); text-align:center; letter-spacing:.12em; margin-bottom:12px; }

  .map-wrapper{ display:flex; justify-content:center; align-items:center; margin-bottom:4px; padding:0 4px; height:400px; background:#fafaf8; border-radius:6px; overflow:hidden; }
  .map-svg{ width:100%; height:100%; display:block; }
  .map-area{ cursor:pointer; transition:filter .1s ease; stroke:#fff; stroke-width:0.8; }
  .map-area:hover{ filter:brightness(0.92); }

  .pref-choice-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:14px 16px 6px; }
  @media (min-width:480px){ .pref-choice-grid{ grid-template-columns:repeat(4,1fr); } }
  .pref-choice-btn{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:14px;
    padding:18px 8px; border-radius:8px; border:2px solid var(--line);
    background:var(--paper); color:var(--ink); cursor:pointer;
    transition:transform .1s ease, border-color .1s ease, background .1s ease;
    text-align:center;
  }
  .pref-choice-btn:hover{ border-color:var(--ink-soft); transform:translateY(-1px); }
  .pref-choice-btn:disabled{ cursor:default; }
  .pref-choice-btn.correct{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .pref-choice-btn.wrong{ background:var(--wrong); border-color:var(--wrong); color:#fff; }
  .pref-choice-btn.reveal{ border-color:var(--correct); color:var(--correct); font-weight:900; }
  .zone-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; pointer-events:none; }
  .zone-label-bg{ pointer-events:none; }

  .pin-drop{ animation: pinDrop .45s cubic-bezier(.34,1.56,.64,1); transform-origin: center; }
  @keyframes pinDrop{ 0%{ transform:translateY(-14px) scale(0.4); opacity:0; } 60%{ transform:translateY(2px) scale(1.15); opacity:1; } 100%{ transform:translateY(0) scale(1); } }
  .target-outline{ animation: outlinePulse 1.1s ease-in-out infinite; }
  @keyframes outlinePulse{ 0%,100%{ stroke-opacity:1; } 50%{ stroke-opacity:.4; } }
  .pin-label-bg{ fill:var(--ink); }
  .pin-label-text{ fill:#fff; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; }

  .q-feedback{ min-height:18px; text-align:center; font-size:13px; font-weight:700; letter-spacing:.05em; margin:6px 0 3px; }
  .q-feedback.ok{ color:var(--correct); }
  .q-feedback.ng{ color:var(--wrong); }

  .q-footer{ display:flex; justify-content:space-between; align-items:center; padding:3px 16px 16px; }
  .score-label{ font-size:13px; color:var(--ink-soft); font-weight:700; }
  .next-btn{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:13px;
    background:var(--ink); color:var(--paper); border:none; border-radius:6px; padding:9px 18px;
    cursor:pointer; letter-spacing:.05em; box-shadow:0 3px 0 rgba(0,0,0,0.25); visibility:hidden;
  }
  .next-btn.show{ visibility:visible; }
  .next-btn:active{ transform:translateY(2px); box-shadow:none; }

  .panel{ background:#fff; border:3px solid var(--ink); border-radius:10px; padding:30px 24px; text-align:center; box-shadow:0 8px 0 rgba(30,42,47,0.10); }
  .panel h2{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:22px; margin:0 0 10px; }
  .panel p{ color:var(--ink-soft); font-size:14px; line-height:1.7; margin:0 0 22px; }

  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .restart-btn, .retry-same-btn{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:16px;
    border:none; border-radius:8px; padding:14px 34px;
    cursor:pointer; letter-spacing:.08em; box-shadow:0 5px 0; transition:all .1s;
  }
  .restart-btn{
    background:var(--gold); color:var(--ink); box-shadow:0 5px 0 #9C7825;
  }
  .restart-btn:active{ transform:translateY(4px); box-shadow:none; }
  .retry-same-btn{
    background:var(--correct); color:#fff; box-shadow:0 5px 0 #1d5a47;
  }
  .retry-same-btn:active{ transform:translateY(4px); box-shadow:none; }

  .result-score{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:52px; margin:6px 0 2px; }
  .result-score span{ font-size:22px; color:var(--ink-soft); font-weight:700; }

  .missed-list{ text-align:left; margin-top:20px; border-top:1px solid var(--line); padding-top:14px; }
  .missed-list h3{ font-size:13px; letter-spacing:.06em; margin:0 0 10px; color:var(--ink-soft); }
  .missed-item{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .missed-item b{ font-weight:700; }
  .missed-item .ans{ color:var(--correct); font-weight:700; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="app">

  <div class="board">
    <div class="eyebrow">1都6県・本物の地図で覚える</div>
    <h1>関東 市町村位置クイズ</h1>
    <div class="sub">地図を5エリアに分割。市町村名を見て、地図の①〜⑤から選ぼう</div>
  </div>

  <div id="startScreen">
    <div style="margin-top:20px; font-size:14px; color:var(--ink-soft); text-align:center; line-height:1.8;">
      県を選んでスタート。離島を除く<b>すべての市町村</b>が出題対象です(毎回ランダムに10問)。<br>
      実際の県境データをもとに地図を5エリアに自動分割しています。解答後は、その市町村の正確な位置にピンが表示されます。
    </div>
    <div class="pref-grid" id="prefGrid" style="margin-top:20px;"></div>
  </div>

  <div id="quizScreen" class="hidden quiz-container">
    <div class="quiz-header">
      <div class="quiz-header-left">
        <div class="quiz-header-title">
          <span id="prefTitle">-</span>
          <span class="pref-color" id="prefLabel" style="background:var(--ink);">-</span>
        </div>
        <div style="font-size:11px; color:var(--ink-soft); margin-bottom:6px;">
          第<span id="qNum">1</span>問 / <span id="qTotal">10</span>
        </div>
        <div class="quiz-progress" id="progress"></div>
      </div>
      <button class="quiz-nav-btn" id="backBtn" onclick="backToTitle()">戻る</button>
    </div>

    <div class="quiz-question">
      <div class="q-body">
        <div class="q-name" id="qName">-</div>
        <div class="q-yomi" id="qYomi">よみ</div>
        <div class="map-wrapper" id="mapWrapper">
          <svg class="map-svg" id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="pref-choice-grid hidden" id="prefChoiceGrid"></div>
        <div class="q-feedback" id="feedback">&nbsp;</div>
      </div>
      <div class="q-footer">
        <div class="score-label">正解 <span id="scoreNow">0</span> / <span id="scoreTotal">10</span></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次へ →</button>
      </div>
    </div>
  </div>

  <div id="resultScreen" class="hidden panel" style="margin-top:20px;">
    <h2>結果発表</h2>
    <div class="result-score"><span id="finalScore">0</span><span id="finalOutOf"> / 10</span></div>
    <p id="resultComment">-</p>
    <div class="missed-list" id="missedList"></div>
    <div class="btn-row" style="margin-top:24px;">
      <button class="restart-btn" onclick="backToStart()">県を選び直す</button>
      <button class="retry-same-btn" id="retrySameBtn" onclick="retryCurrentPref()">もう一回やる</button>
    </div>
  </div>

</div>

<script>

let selectedPref = null;
let roundQuestions = [];
let currentIdx = 0;
let score = 0;
let missed = [];
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildWorkQuiz(){
  return WORK_LIST_RAW.map(w => {
    const item = MAP_DATA[w.p].quiz.find(x => x.q === w.q);
    return { q: item.q, y: item.y, z: item.z, p: w.p };
  });
}

function buildPrefGrid(){
  const grid = document.getElementById('prefGrid');
  grid.innerHTML = '';

  const workCard = document.createElement('div');
  workCard.className = 'pref-card work-card';
  workCard.onclick = () => startQuiz(SPECIAL_WORK_KEY);
  workCard.innerHTML = `<div class="pref-card-name">★ 仕事でよく使う地名(位置)</div><div class="pref-card-num">${WORK_LIST_RAW.length}問　・　地図でエリア選択</div>`;
  grid.appendChild(workCard);

  const prefQuizCard = document.createElement('div');
  prefQuizCard.className = 'pref-card work-card';
  prefQuizCard.onclick = () => startQuiz(SPECIAL_PREF_KEY);
  prefQuizCard.innerHTML = `<div class="pref-card-name">★ 仕事でよく使う地名(何県?)</div><div class="pref-card-num">${WORK_LIST_RAW.length}問　・　都道府県当て</div>`;
  grid.appendChild(prefQuizCard);

  Object.entries(MAP_DATA).forEach(([pref, d]) => {
    const card = document.createElement('div');
    card.className = 'pref-card';
    card.onclick = () => startQuiz(pref);
    card.innerHTML = `<div class="pref-card-name">${pref}</div><div class="pref-card-num">${d.quiz.length}問収録</div>`;
    grid.appendChild(card);
  });
}

function startQuiz(pref){
  backConfirmPending = false;
  if(backConfirmTimer) clearTimeout(backConfirmTimer);
  const backBtnReset = document.getElementById('backBtn');
  if(backBtnReset){ backBtnReset.textContent = '戻る'; backBtnReset.style.background = ''; }

  selectedPref = pref;
  const isWork = (pref === SPECIAL_WORK_KEY);
  const isPrefQuiz = (pref === SPECIAL_PREF_KEY);
  quizMode = isPrefQuiz ? 'pref' : 'map';
  const pool = (isWork || isPrefQuiz) ? buildWorkQuiz() : MAP_DATA[pref].quiz;
  roundQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));
  currentIdx = 0; score = 0; missed = [];

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');

  document.getElementById('prefTitle').textContent = isPrefQuiz ? '仕事でよく使う地名(何県?)' : (isWork ? '仕事でよく使う地名(位置)' : pref);
  document.getElementById('scoreTotal').textContent = roundQuestions.length;

  buildProgress();
  renderQuestion();
}

function buildProgress(){
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for(let i=0; i<roundQuestions.length; i++){
    const d = document.createElement('div');
    d.className = 'prog-dot'; d.id = 'pdot-'+i;
    prog.appendChild(d);
  }
}

function updateProgress(){
  for(let i=0; i<roundQuestions.length; i++){
    const d = document.getElementById('pdot-'+i);
    d.classList.remove('done','current');
    if(i < currentIdx) d.classList.add('done');
    else if(i === currentIdx) d.classList.add('current');
  }
}

function renderQuestion(){
  answered = false;
  updateProgress();
  const item = roundQuestions[currentIdx];

  document.getElementById('qNum').textContent = currentIdx + 1;
  document.getElementById('qTotal').textContent = roundQuestions.length;
  document.getElementById('qName').textContent = item.q;
  document.getElementById('qYomi').textContent = item.y;
  document.getElementById('feedback').textContent = '\u00A0';
  document.getElementById('feedback').className = 'q-feedback';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('scoreNow').textContent = score;

  if(quizMode === 'pref'){
    // 何県?クイズ: 答えを先に見せないよう、バッジは伏せる
    document.getElementById('prefLabel').textContent = '?';
    document.getElementById('prefLabel').style.background = 'var(--ink-soft)';
    document.getElementById('mapWrapper').classList.add('hidden');
    document.getElementById('prefChoiceGrid').classList.remove('hidden');
    renderPrefChoices(item);
  } else {
    document.getElementById('mapWrapper').classList.remove('hidden');
    document.getElementById('prefChoiceGrid').classList.add('hidden');
    const itemPref = item.p || selectedPref;
    document.getElementById('prefLabel').textContent = itemPref;
    document.getElementById('prefLabel').style.background = PREF_INFO[itemPref].color;
    renderMap(itemPref, item);
  }
}

function renderPrefChoices(item){
  const grid = document.getElementById('prefChoiceGrid');
  grid.innerHTML = '';
  PREF_ORDER.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pref-choice-btn';
    btn.textContent = p;
    btn.onclick = () => selectPrefAnswer(p, item, btn);
    grid.appendChild(btn);
  });
}

function selectPrefAnswer(selected, item, btnEl){
  if(answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.pref-choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if(b.textContent === item.p) b.classList.add('reveal');
  });

  const fb = document.getElementById('feedback');
  if(selected === item.p){
    score++;
    btnEl.classList.remove('reveal');
    btnEl.classList.add('correct');
    fb.textContent = '正解! ' + item.q + 'は' + item.p;
    fb.className = 'q-feedback ok';
  } else {
    btnEl.classList.add('wrong');
    fb.textContent = '不正解… 正解は' + item.p;
    fb.className = 'q-feedback ng';
    missed.push(item);
  }

  document.getElementById('scoreNow').textContent = score;
  document.getElementById('nextBtn').classList.add('show');
}

function renderMap(pref, currentItem){
  const cfg = MAP_DATA[pref];
  const svg = document.getElementById('mapSvg');
  svg.setAttribute('viewBox', `0 0 ${cfg.width} ${cfg.height}`);
  svg.innerHTML = '';

  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width', cfg.width); bg.setAttribute('height', cfg.height);
  bg.setAttribute('fill', '#fafaf8');
  svg.appendChild(bg);

  const areaLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  areaLayer.setAttribute('id','areaLayer');
  svg.appendChild(areaLayer);

  Object.entries(cfg.municipalities).forEach(([name, m]) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', m.path);
    path.setAttribute('fill', ZONE_COLOR[m.cluster]);
    path.setAttribute('fill-opacity', '0.32');
    path.setAttribute('class', 'map-area');
    path.dataset.cluster = m.cluster;
    path.dataset.name = name;
    path.onclick = () => selectZone(m.cluster, currentItem, path);
    areaLayer.appendChild(path);
  });

  const badgeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  badgeLayer.setAttribute('id','badgeLayer');
  Object.entries(cfg.clusters).forEach(([num, pos]) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('pointer-events','none');
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', pos.labelX); circle.setAttribute('cy', pos.labelY);
    circle.setAttribute('r', 15);
    circle.setAttribute('fill', ZONE_COLOR[num]);
    circle.setAttribute('stroke', '#fff'); circle.setAttribute('stroke-width','2');
    circle.setAttribute('class','zone-label-bg');
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', pos.labelX); text.setAttribute('y', pos.labelY+6);
    text.setAttribute('text-anchor','middle'); text.setAttribute('font-size','16');
    text.setAttribute('fill', '#fff'); text.setAttribute('class','zone-label');
    text.textContent = num;
    g.appendChild(circle); g.appendChild(text);
    badgeLayer.appendChild(g);
  });
  svg.appendChild(badgeLayer);

  const pinLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  pinLayer.setAttribute('id','pinLayer');
  svg.appendChild(pinLayer);
}

function dropPin(cfg, item, isCorrectClick){
  const target = cfg.municipalities[item.q];
  if(!target) return;
  const pinLayer = document.getElementById('pinLayer');
  pinLayer.innerHTML = '';

  const outline = document.createElementNS('http://www.w3.org/2000/svg','path');
  outline.setAttribute('d', target.path);
  outline.setAttribute('fill', isCorrectClick ? 'var(--correct)' : 'var(--wrong)');
  outline.setAttribute('fill-opacity', '0.85');
  outline.setAttribute('stroke', '#fff');
  outline.setAttribute('stroke-width', '2');
  outline.setAttribute('class', 'target-outline');
  pinLayer.appendChild(outline);

  const pinColor = isCorrectClick ? '#2E7D5B' : '#B23A2E';
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class', 'pin-drop');
  g.setAttribute('transform', `translate(${target.cx},${target.cy})`);

  const pinPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  pinPath.setAttribute('d', 'M 0,0 C -9,-14 -11,-20 -11,-25 A 11,11 0 1 1 11,-25 C 11,-20 9,-14 0,0 Z');
  pinPath.setAttribute('fill', pinColor);
  pinPath.setAttribute('stroke', '#fff');
  pinPath.setAttribute('stroke-width', '1.5');
  g.appendChild(pinPath);

  const pinDot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  pinDot.setAttribute('cx', 0); pinDot.setAttribute('cy', -25); pinDot.setAttribute('r', 4);
  pinDot.setAttribute('fill', '#fff');
  g.appendChild(pinDot);

  const labelText = item.q;
  const charW = 12.5;
  const boxW = Math.max(40, labelText.length * charW + 14);
  const labelBg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  labelBg.setAttribute('x', -boxW/2); labelBg.setAttribute('y', -52);
  labelBg.setAttribute('width', boxW); labelBg.setAttribute('height', 20);
  labelBg.setAttribute('rx', 4);
  labelBg.setAttribute('class','pin-label-bg');
  g.appendChild(labelBg);

  const labelTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
  labelTxt.setAttribute('x', 0); labelTxt.setAttribute('y', -37.5);
  labelTxt.setAttribute('text-anchor','middle');
  labelTxt.setAttribute('font-size','13');
  labelTxt.setAttribute('class','pin-label-text');
  labelTxt.textContent = labelText;
  g.appendChild(labelTxt);

  pinLayer.appendChild(g);
}

function selectZone(cluster, item, pathEl){
  if(answered) return;
  answered = true;

  const cfg = MAP_DATA[item.p || selectedPref];
  const allPaths = document.querySelectorAll('.map-area');
  allPaths.forEach(p => { p.style.pointerEvents = 'none'; });

  const fb = document.getElementById('feedback');
  const correctCluster = item.z;
  const marks = '\u2460\u2461\u2462\u2463\u2464';
  const isCorrect = (cluster === correctCluster);

  if(isCorrect){
    score++;
    fb.textContent = '正解! ' + item.q + 'は ' + marks[correctCluster-1] + ' エリア';
    fb.className = 'q-feedback ok';
  } else {
    fb.textContent = '不正解… 正解は ' + marks[correctCluster-1] + ' エリア';
    fb.className = 'q-feedback ng';
    missed.push(item);
  }

  allPaths.forEach(p => p.setAttribute('fill-opacity','0.16'));
  dropPin(cfg, item, isCorrect);

  document.getElementById('scoreNow').textContent = score;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  currentIdx++;
  if(currentIdx >= roundQuestions.length){ showResult(); }
  else { renderQuestion(); }
}

function showResult(){
  updateProgress();
  document.getElementById('quizScreen').classList.add('hidden');
  const resultScreen = document.getElementById('resultScreen');
  resultScreen.classList.remove('hidden');

  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalOutOf').textContent = ` / ${roundQuestions.length}`;

  const rate = score / roundQuestions.length;
  let comment;
  if(rate === 1) comment = "満点! 地図が頭に入っています。";
  else if(rate >= 0.8) comment = "かなり良い成績。各エリアの感覚がついてきています。";
  else if(rate >= 0.5) comment = "半分以上正解。繰り返すほど地図感覚が身につきます。";
  else comment = "まだ地図への理解は発展途上。もう一度挑戦してみましょう。";
  document.getElementById('resultComment').textContent = comment;

  const missedDiv = document.getElementById('missedList');
  if(missed.length === 0){
    missedDiv.innerHTML = '<h3>間違えた問題</h3><div class="missed-item">なし(全問正解)</div>';
  } else {
    let html = '<h3>間違えた問題</h3>';
    const marks = '\u2460\u2461\u2462\u2463\u2464';
    missed.forEach(m => {
      if(quizMode === 'pref'){
        html += `<div class="missed-item"><span><b>${m.q}</b>（${m.y}）</span><span class="ans">${m.p}</span></div>`;
      } else {
        const prefTag = m.p ? `${m.p} ／ ` : '';
        html += `<div class="missed-item"><span><b>${m.q}</b>（${prefTag}${m.y}）</span><span class="ans">${marks[m.z-1]} エリア</span></div>`;
      }
    });
    missedDiv.innerHTML = html;
  }
}

let backConfirmPending = false;
let backConfirmTimer = null;

function backToTitle(){
  const btn = document.getElementById('backBtn');
  if(!backConfirmPending){
    backConfirmPending = true;
    btn.textContent = 'もう一度押すと戻る';
    btn.style.background = 'var(--wrong)';
    backConfirmTimer = setTimeout(() => {
      backConfirmPending = false;
      btn.textContent = '戻る';
      btn.style.background = '';
    }, 2500);
    return;
  }
  clearTimeout(backConfirmTimer);
  backConfirmPending = false;
  const btn2 = document.getElementById('backBtn');
  if(btn2){ btn2.textContent = '戻る'; btn2.style.background = ''; }
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function backToStart(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function retryCurrentPref(){
  startQuiz(selectedPref);
}

buildPrefGrid();
</script>
